name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Actions sets CI=true, so the tests run once (no watch mode)
      # and the build treats lint warnings as errors
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
